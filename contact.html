  <style>
    /* ═══════════════════════════════════════════
       SOCIAL TOOLTIP BUTTONS
       ═══════════════════════════════════════════ */

    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 64px;
      align-items: flex-end;
      padding-top: 8px;
    }

    /* ── Tooltip container ── */
    .tooltip-container {
      position:    relative;
      cursor:      pointer;
      font-size:   17px;
      border-radius: 10px;
    }

    /* ── Popup card (hidden by default) ── */
    .tooltip {
      position:       absolute;
      bottom:         100%;
      left:           50%;
      transform:      translateX(-50%);
      margin-bottom:  12px;
      padding:        10px;
      opacity:        0;
      pointer-events: none;
      transition:     opacity 0.25s ease, transform 0.25s ease;
      transform:      translateX(-50%) translateY(6px);
      border-radius:  15px;
      white-space:    nowrap;
      z-index:        50;
      box-shadow:
        inset 5px  5px  5px  rgba(0,0,0,0.2),
        inset -5px -5px 15px rgba(255,255,255,0.05),
        5px  5px  15px rgba(0,0,0,0.4),
        -5px -5px 15px rgba(255,255,255,0.03);
    }

    .tooltip-container:hover .tooltip {
      opacity:   1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Profile card inside tooltip ── */
    .profile {
      background:    #1e1e1e;
      border-radius: 10px 15px;
      padding:       12px 14px;
      min-width:     200px;
    }

    /* Instagram profile card border */
    .tooltip-insta .profile {
      border: 1px solid #52382f;
    }

    /* WhatsApp profile card border */
    .tooltip-wa .profile {
      border: 1px solid #1a4030;
    }

    .user {
      display: flex;
      gap:     10px;
      align-items: center;
    }

    .profile-img {
      width:         50px;
      height:        50px;
      font-size:     18px;
      font-weight:   700;
      border-radius: 10px;
      display:       flex;
      align-items:   center;
      justify-content: center;
      flex-shrink:   0;
      background:    #fff;
    }

    /* Instagram avatar colours */
    .tooltip-insta .profile-img {
      border: 1px solid #e6683c;
      color:  #e6683c;
    }

    /* WhatsApp avatar colours */
    .tooltip-wa .profile-img {
      border: 1px solid #25d366;
      color:  #25d366;
    }

    .profile-details {
      display:        flex;
      flex-direction: column;
      gap:            2px;
    }

    .profile-name {
      font-size:   15px;
      font-weight: 700;
    }

    .tooltip-insta .profile-name { color: #e6683c; }
    .tooltip-wa    .profile-name { color: #25d366; }

    .profile-handle {
      font-size: 12px;
      color:     #888;
    }

    .profile-meta {
      font-size:   12px;
      color:       #aaa;
      padding-top: 8px;
      margin-top:  8px;
      border-top:  1px solid #2a2a2a;
    }

    /* ── Icon button (the layered square) ── */
    .soc-icon {
      text-decoration: none;
      color:           #fff;
      display:         block;
      position:        relative;
    }

    .layer {
      width:      55px;
      height:     55px;
      transition: transform 0.3s;
      position:   relative;
    }

    .soc-icon:hover .layer {
      transform: rotate(-35deg) skew(20deg);
    }

    .layer span {
      position:      absolute;
      top:           0;
      left:          0;
      height:        100%;
      width:         100%;
      border-radius: 15px;
      transition:    all 0.3s;
    }

    /* Instagram layer colour */
    .tooltip-insta .layer span {
      border: 1.5px solid #e6683c;
    }

    /* WhatsApp layer colour */
    .tooltip-wa .layer span {
      border: 1.5px solid #25d366;
    }

    /* Layered stacking on hover */
    .soc-icon:hover .layer span:nth-child(1) { opacity: 0.2; }
    .soc-icon:hover .layer span:nth-child(2) { opacity: 0.4; transform: translate(5px,  -5px);  }
    .soc-icon:hover .layer span:nth-child(3) { opacity: 0.6; transform: translate(10px, -10px); }
    .soc-icon:hover .layer span:nth-child(4) { opacity: 0.8; transform: translate(15px, -15px); }
    .soc-icon:hover .layer span:nth-child(5) { opacity: 1;   transform: translate(20px, -20px); }

    /* Icon SVG wrapper — fills the layer */
    .icon-svg-wrap {
      position:        absolute;
      inset:           0;
      display:         flex;
      align-items:     center;
      justify-content: center;
      border-radius:   15px;
      font-size:       24px;
    }

    /* Instagram gradient fill */
    .icon-insta-grad {
      background: linear-gradient(
        45deg,
        #f09433 0%,
        #e6683c 25%,
        #dc2743 50%,
        #cc2366 75%,
        #bc1888 100%
      );
    }

    /* WhatsApp green fill */
    .icon-wa-grad {
      background: #25d366;
    }

    /* Label that appears below icon on hover */
    .icon-label {
      position:   absolute;
      left:       50%;
      bottom:     -5px;
      opacity:    0;
      font-size:  12px;
      font-weight: 500;
      white-space: nowrap;
      transform:  translateX(-50%);
      transition: bottom 0.3s ease, opacity 0.3s ease;
    }

    .tooltip-insta .icon-label { color: #e6683c; }
    .tooltip-wa    .icon-label { color: #25d366; }

    .soc-icon:hover .icon-label {
      bottom:  -30px;
      opacity: 1;
    }
  </style>
